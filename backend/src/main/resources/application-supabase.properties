# All three connection values must be supplied through the process environment.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Separate migration credentials can be supplied by the schema owner.
spring.flyway.user=${CAREEATS_MIGRATION_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.flyway.password=${CAREEATS_MIGRATION_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
# Explicit opt-in only after migration review; see backend/DATABASE.md.
spring.flyway.enabled=${CAREEATS_MIGRATE:false}
