spring.application.name=backend

# PRC pricing values are configurable for the Phase III demonstration.
# The small-order threshold is checked against the item subtotal before fees.
# The $20 threshold keeps smaller orders accessible while covering delivery costs.
# The 12% service-fee rate is a middle ground informed by comparable delivery
# services: 5% was considered too low to support the startup's operating costs.
prc.pricing.delivery-fee=3.99
prc.pricing.service-fee-rate=0.12
prc.pricing.small-order-threshold=20.00
prc.pricing.small-order-surcharge=2.99
