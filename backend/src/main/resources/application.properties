spring.application.name=backend

# PRC pricing values are configurable for the Phase III demonstration.
# The small-order threshold is checked against the item subtotal before fees.
# The $20 threshold keeps smaller orders accessible while covering delivery costs.
# The 12% service-fee rate is a middle ground informed by comparable delivery
# services: 5% was considered too low to support the startup's operating costs.
prc.pricing.delivery-fee=3.99
prc.pricing.service-fee-rate=0.12
prc.pricing.small-order-threshold=20.00
prc.pricing.small-order-surcharge=2.99

# Local development is isolated from the shared database unless supabase is selected.
spring.profiles.default=local
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=careeats
spring.flyway.schemas=careeats
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.sql.init.mode=never
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
careeats.seed.enabled=false
